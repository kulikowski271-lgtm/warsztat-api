version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: warsztat_db
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-haslomaslo123}
      POSTGRES_DB: ${DB_NAME:-warsztat_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: